name: RedeemCodes
version: '${project.version}'
main: xyz.redoxlabs.redeemcodes.Main
api-version: '1.13'
description: "The best free custom redeem codes, vouchers, and server rewards plugin for Minecraft!"
author: 'Redoxlabs'
softdepend: [PlaceholderAPI]
folia-supported: true
commands:
  redeem:
    description: Redeem a code to claim your reward.
    usage: /redeem <code>
    aliases: [claim, redeemcode]

  redeemcodes:
    description: Manage redeem codes.
    usage: /redeemcodes <action> [args...]
    aliases: [rc, codes, code, redeemc, rcodes, RC, REDEEMCODES]

permissions:
  redeemcodes.admin:
    description: Allows access to all admin commands.
    default: op




