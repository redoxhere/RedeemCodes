# This file stores "Premade" reward packs.
# Each entry under 'premades' is a list of commands.
# Placeholders: %player%, %uuid%, %world%, %displayname%, %random-min-max%

premades:
  # 1. VIP Rank
  vip_rank:
    - "lp user %player% parent add vip"
    - "broadcast §a%player% has just redeemed the VIP rank!"

  # 2. Currency Pack (Small)
  money_small:
    - "eco give %player% 1000"
    - "msg %player% §a+1000 Coins"

  # 3. Currency Pack (Large)
  money_large:
    - "eco give %player% 50000"
    - "broadcast §6%player% just found a large bag of money!"

  # 4. XP Boost
  xp_levels:
    - "xp add %player% 30 levels"
    - "msg %player% §bYou received 30 XP Levels!"

  # 5. Crate Keys (Requires a crate plugin)
  crate_keys:
    - "crate key give %player% common 3"
    - "crate key give %player% rare 1"
    - "msg %player% §eYou received 3 Common and 1 Rare key."

  # 6. Kit: Warrior
  kit_warrior:
    - "give %player% iron_sword 1"
    - "give %player% iron_chestplate 1"
    - "give %player% golden_apple 5"

  # 7. Kit: Miner
  kit_miner:
    - "give %player% diamond_pickaxe{Enchantments:[{id:efficiency,lvl:3}]} 1"
    - "give %player% torch 64"
    - "give %player% cooked_beef 16"

  # 8. Teleport (Spawn)
  teleport_spawn:
    - "spawn %player%"
    - "title %player% title {\"text\":\"§aWarped to Spawn\"}"

  # 9. Server Announcement
  shout_out:
    - "broadcast §d§l%player% §dsupports the server! Thank you!"
    - "give %player% diamond 1"

  # 10. Random Gamble
  gamble_reward:
    - "eco give %player% %random-100-10000%"
    - "msg %player% §7You rolled the dice and won some cash!"