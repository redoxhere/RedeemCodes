# ==========================================================
#                  REDEEMCODES MESSAGES
# ==========================================================
#
# --- COLOR & FORMATTING ----------------------------------
# • Standard Bukkit Colors: Use '&' (e.g., &a, &b, &c, &1).
# • Hex Colors: Use '&#RRGGBB' (e.g., &#FF6347, &#00BFFF).
#   (Note: Hex colors automatically downgrade to the closest 
#   legacy color if your server is running a version older 
#   than 1.16).
#
# --- INTERACTIVE MESSAGES --------------------------------
# You can make chat messages interactive using these tags:
# • Hover text: <hover:Your text here>Text</hover>
# • Click action: <click:run_command:/command>Text</click>
# 
# Supported Click Actions:
#  - run_command (Executes a command for the player)
#  - suggest_command (Types the command in their chat bar)
#  - open_url (Opens a URL)
#
# Combine them! Example:
# <hover:&#00BFFFClick here!><click:run_command:/rc list>List</click></hover>
#
# --- PLACEHOLDERAPI --------------------------------------
# If you have PlaceholderAPI installed, you can use any PAPI
# placeholder (like %player_name%) in these messages!
#
# ==========================================================

